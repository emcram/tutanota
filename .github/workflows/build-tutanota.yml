name: Build Tuta Mail Desktop (Debian)

on:
  push:
    tags:
      - "gl-tutanota-v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

env:
  emscripten_version: 3.1.59

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      tag_version: ${{ steps.version.outputs.tag_version }}
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout shared actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ vars.GH_ACTIONS_SHARED_PROJ }}
          ref: ${{ vars.GH_ACTIONS_SHARED_REF }}
          path: .github/actions/gh-actions
          persist-credentials: false
          fetch-depth: 1

      - name: Ensure tag is on mcr/release
        if: startsWith(github.ref, 'refs/tags/gl-')
        uses: ./.github/actions/gh-actions/require-release-tip
        with:
          release_branch: mcr/release
          allow_merge_commits: "true"

      - name: Resolve versions
        id: version
        run: |
          PKG_VERSION=$(node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('package.json','utf8')).version; console.log(v)")
          TAG_VERSION=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "${TAG}" =~ ^gl-tutanota-v[0-9]+\.[0-9]+\.[0-9]+(-r[0-9]+)?$ ]]; then
              echo "Invalid tag: ${TAG}. Expected gl-tutanota-v<version> (e.g. gl-tutanota-v319.260107.1)." >&2
              exit 1
            fi
            TAG_VERSION="${TAG#gl-tutanota-v}"
            TAG_VERSION="${TAG_VERSION%%-r*}"
          else
            TAG_VERSION="${PKG_VERSION}"
          fi
          echo "package_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "Tag version ${TAG_VERSION} does not match package.json version ${PKG_VERSION}." >&2
            exit 1
          fi

  build-linux:
    name: Build Tuta Mail Desktop (linux/deb)
    runs-on: ubuntu-24.04
    needs: setup
    env:
      TUTA_VERSION_OVERRIDE: ${{ needs.setup.outputs.tag_version }}
      rust-targets: wasm32-unknown-unknown
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: 'true'

      - name: Setup Node.js + deps
        uses: ./.github/shared/setup

      - name: Setup Rust
        uses: ./.github/shared/setup-rust

      - name: Setup Emscripten
        uses: ./.github/shared/setup-emscripten
        with:
          emscripten-version: ${{ env.emscripten_version }}

      - name: Build Debian package
        run: |
          npm run build-packages
          node desktop --custom-desktop-release --platform linux --architecture x64

      - name: Verify artifacts
        run: |
          ls -la artifacts/desktop
          deb_file=$(ls artifacts/desktop/*.deb | head -n 1)
          test -f "${deb_file}"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tutanota-desktop-debian-${{ needs.setup.outputs.tag_version }}
          path: |
            artifacts/desktop/*.deb
          if-no-files-found: error
